# Heltec WiFi LoRa 32 V4 (ESP32-S3, SX1262, 868 MHz) as a wM-Bus receiver.
# Pinout / RF front-end control taken from Meshtastic variants/esp32s3/heltec_v4/variant.h
#
# The V4 has an RF front-end module (FEM) between the SX1262 and the antenna:
#   V4.2 -> GC1109,  V4.3 -> KCT8103L
# It MUST be powered and enabled, otherwise reception is (almost) dead.
# Set the `fem_*` switches below according to your board revision.
#
# This config lives inside the component repo and uses the local (patched)
# components, so the 1.8 V TCXO option (`tcxo_voltage`) needed by the Heltec
# V3/V4 is available. See the commented github source to run it from a pushed
# copy of this fork instead.

substitutions:
  name: "wmbus-heltec-v4"
  friendly_name: "wM-Bus Heltec V4"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"

esp32:
  board: heltec_wifi_lora_32_V3   # no V4 entry in PlatformIO yet; same ESP32-S3 family
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      # wmbusmeters decodes telegrams in the main loop and needs more than the
      # default 8 KB stack. Needs a recent ESPHome (2026.9 has it, 2025.10 not).
      loop_task_stack_size: 32768

external_components:
  # Pull the (patched) components straight from this fork on GitHub, so the
  # config builds anywhere (e.g. HA's ESPHome Device Builder) without the
  # components/ folder next to it.
  - source: github://slaveq86/esphome-components_fork@main
    refresh: 0s
    # Only the wM-Bus parts. The repo also carries an old copy of ESPHome's
    # esp32 platform that breaks newer ESPHome ("Component not found: logger").
    components: [wmbus_radio, wmbus_meter, wmbus_common]
  # To build against a local checkout of this fork instead, comment the block
  # above and use:
  # - source:
  #     type: local
  #     path: components
  #   components: [wmbus_radio, wmbus_meter, wmbus_common]

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback hotspot when Wi-Fi is unreachable. Without a password anyone in
  # range could join the captive portal and point the device at their network.
  ap:
    password: !secret ap_password

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

# ---- RF front end + Vext power -------------------------------------------
switch:
  # Vext (active low): OLED + LoRa antenna boost power
  - platform: gpio
    id: vext
    pin:
      number: GPIO36
      inverted: true
    restore_mode: ALWAYS_ON
    internal: true

  # FEM LDO power (V4.2 and V4.3)
  - platform: gpio
    id: fem_power
    pin: GPIO7
    restore_mode: ALWAYS_ON
    internal: true

  # FEM chip enable CSD (V4.2 and V4.3)
  - platform: gpio
    id: fem_enable
    pin: GPIO2
    restore_mode: ALWAYS_ON
    internal: true

  # V4.2 / GC1109: CPS low = PA bypass (don't care in RX, keep PA off)
  - platform: gpio
    id: fem_gc1109_cps
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_OFF
    internal: true

  # V4.3 / KCT8103L: CTX low = RX with LNA. Uncomment for V4.3 and
  # remove the GC1109 switch above.
  # - platform: gpio
  #   id: fem_kct8103l_ctx
  #   pin: GPIO5
  #   restore_mode: ALWAYS_OFF
  #   internal: true

# ---- SX1262 ----------------------------------------------------------------
spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11

wmbus_radio:
  radio_type: SX1262
  cs_pin: GPIO8
  reset_pin: GPIO12
  irq_pin: GPIO14        # DIO1
  busy_pin: GPIO13
  rf_switch: true        # DIO2 drives the FEM TX/RX select
  has_tcxo: true
  tcxo_voltage: 1.8V     # Heltec V3/V4 TCXO runs at 1.8 V (patched option)
  on_frame:
    - then:
        - logger.log:
            format: "RSSI: %ddBm T: %s (%d) %s"
            args: [ frame->rssi(), frame->as_hex().c_str(), frame->data().size(), toString(frame->link_mode()) ]
        # Remember the last frame for the OLED (any meter, not only ours).
        - lambda: |-
            auto &d = frame->data();
            id(disp_frames) += 1;
            id(disp_rssi) = frame->rssi();
            id(disp_last_ms) = millis();
            if (d.size() >= 8) {
              // A-field: meter id, 4 BCD bytes, least significant first
              char buf[9];
              snprintf(buf, sizeof(buf), "%02x%02x%02x%02x", d[7], d[6], d[5], d[4]);
              id(disp_last_id) = buf;
            }

# ---- Meter -----------------------------------------------------------------
# Start without a meter: every received telegram is logged with a
# https://wmbusmeters.org/analyze/<hex> link to identify driver and fields.
# Then fill in meter_id / type and uncomment. A DIEHL IZAR needs no key.
#
# wmbus_meter:
#   - id: water_meter
#     meter_id: 0x12345678
#     type: izar
#     mode: [T1]
#
# sensor:
#   - platform: wmbus_meter
#     parent_id: water_meter
#     field: total_m3
#     name: "Water total"
#     accuracy_decimals: 3
#     device_class: water
#     state_class: total_increasing
#     on_value:
#       - lambda: 'id(disp_total) = x;'   # shown on the OLED
#
#   - platform: wmbus_meter
#     parent_id: water_meter
#     field: rssi_dbm
#     name: "Water meter RSSI"
#     device_class: signal_strength
#     entity_category: diagnostic

# ---- OLED (built-in 0.96" SSD1306, 128x64) --------------------------------
# Powered by Vext (switch above). Pins as on the Heltec V3 / Meshtastic
# heltec_v4 variant: SDA 17, SCL 18, reset 21.
#
#   wM-Bus          12:34      <- header + time from Home Assistant
#   3.488 m3                   <- meter total (once the meter block is on)
#   21242472  -72 dBm          <- id + RSSI of the last frame (any meter)
#   frames 17   42 s ago       <- frames received since boot, age of last
globals:
  - id: disp_frames
    type: uint32_t
    initial_value: '0'
  - id: disp_rssi
    type: int
    initial_value: '0'
  - id: disp_last_ms
    type: uint32_t
    initial_value: '0'
  - id: disp_last_id
    type: std::string
    initial_value: '""'
  - id: disp_total
    type: float
    initial_value: 'NAN'

i2c:
  sda: GPIO17
  scl: GPIO18
  frequency: 400kHz

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 11
  - file: "gfonts://Roboto@500"
    id: font_big
    size: 18

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    reset_pin: GPIO21
    update_interval: 1s
    lambda: |-
      auto now = id(ha_time).now();
      it.print(0, 0, id(font_small), "wM-Bus");
      it.print(it.get_width(), 0, id(font_small), TextAlign::TOP_RIGHT,
               now.is_valid() ? now.strftime("%H:%M").c_str() : "--:--");

      if (std::isnan(id(disp_total)))
        it.print(0, 14, id(font_big), "--- m3");
      else
        it.printf(0, 14, id(font_big), "%.3f m3", id(disp_total));

      if (id(disp_frames) == 0) {
        it.print(0, 38, id(font_small), "waiting for telegrams");
        return;
      }
      it.printf(0, 38, id(font_small), "%s  %d dBm",
                id(disp_last_id).c_str(), id(disp_rssi));
      uint32_t age = (millis() - id(disp_last_ms)) / 1000;
      if (age < 120)
        it.printf(0, 51, id(font_small), "frames %u   %u s ago",
                  (unsigned) id(disp_frames), (unsigned) age);
      else
        it.printf(0, 51, id(font_small), "frames %u   %u min ago",
                  (unsigned) id(disp_frames), (unsigned) (age / 60));
